name: CarGlow
options:
  bundleIdPrefix: com.toniesan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: Y5W7BT59Q3
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CarGlow:
    type: application
    platform: iOS
    sources: [CarGlow]
    info:
      path: CarGlow/Info.plist
      properties:
        CFBundleDisplayName: Car Light
        INAlternativeAppNames:
          - INAlternativeAppName: Car Lights
          - INAlternativeAppName: CarGlow
          - INAlternativeAppName: Polo Light
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: Car Light uses Bluetooth to control the LED strips in your car.
        UIBackgroundModes: [bluetooth-central]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.toniesan.carglow
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": CarGlow/CarGlow-CarPlay.entitlements
